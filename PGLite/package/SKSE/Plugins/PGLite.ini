[General]
; Key that opens the PGLite menu, as a DirectInput scan code (F9 = 67, F10 = 68, F11 = 87, F12 = 88, Insert = 210).
iMenuKey=67
; Lowest level written to My Games\Skyrim Special Edition\SKSE\PGLite.log: trace, debug, info, warn or error.
sLogLevel=info
; Leave facegen heads unpatched (the --exclude-facegens flag of the offline program).
bExcludeFacegens=false
; Do not set the dynamic cubemap on complex material shapes (the --no-dyn-cubemap flag of the offline program).
bDisableDynamicCubemap=false
