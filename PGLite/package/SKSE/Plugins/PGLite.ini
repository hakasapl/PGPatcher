[General]
; Key that opens the PGLite menu, as a DirectInput scan code (F8 = 66, F9 = 67, F10 = 68, F11 = 87, F12 = 88, Insert = 210).
iMenuKey=66
; Lowest level written to My Games\Skyrim Special Edition\SKSE\PGLite.log: trace, debug, info, warn or error.
sLogLevel=info
; Leave facegen heads unpatched (the --exclude-facegens flag of the offline program).
bExcludeFacegens=false
; Do not set the dynamic cubemap on complex material shapes (the --disable-dyncubemap flag of the offline program).
bDisableDynamicCubemap=false
; Upgrade every parallax match to complex material, not only the ones that cannot keep parallax (the --force-always-cm flag of the offline program).
bForceAlwaysCM=false
; Show "Loading PGLite" and the current step in the top right corner while PGLite initializes after the game data loaded.
bShowLoadingMessage=true
; Show "Welcome to PGLite" with the menu key in the top right corner after PGLite initialized, until the menu was opened once.
bShowWelcomeMessage=true
