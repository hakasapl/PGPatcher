name: Claude Code Review
run-name: Claude Code Review of PR #${{ inputs.pr }} (${{ inputs.model }}, ${{ inputs.effort }})

# Reviews run only when started by hand: Actions > Claude Code Review > Run workflow,
# or `gh workflow run claude-code-review.yml -f pr=<number> -f model=<model> -f effort=<effort>`.
# A manual run uses this repository's secrets, so it also works on pull requests from forks.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        type: number
        required: true
      model:
        description: Model
        type: choice
        options:
          - claude-opus-5-5
          - claude-sonnet-5-5
          - claude-fable-5-1
        default: claude-opus-5-5
      effort:
        description: Effort
        type: choice
        options:
          - low
          - medium
          - high
          - xhigh
          - max
        default: high

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      # Checks out the dispatching branch, not the pull request: the review reads the change with
      # gh, and a fork's CLAUDE.md never becomes Claude's instructions.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The action only installs its inline comment tool for pull request events, so a manual run
      # posts each inline comment through the pull request review comments API instead.
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ inputs.pr }}

            The mcp__github_inline_comment__create_inline_comment tool is not available in this run.
            Wherever the review says to use it, post each issue as its own inline comment on the diff with
            `gh api repos/${{ github.repository }}/pulls/${{ inputs.pr }}/comments`, one call per issue,
            setting commit_id to the pull request's head sha, path, line, side RIGHT and body (add
            start_line and start_side RIGHT for a range). Never collect the issues into one comment.
          claude_args: >-
            --model ${{ inputs.model }}
            --effort ${{ inputs.effort }}
            --allowedTools "Bash(gh api repos/${{ github.repository }}/pulls/${{ inputs.pr }}/*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
