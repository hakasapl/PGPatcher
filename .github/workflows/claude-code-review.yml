name: Claude Code Review

# A maintainer requests a review by commenting /claude-review on a pull request. Comment events run in
# this repository's context with its secrets, so this also works on pull requests from forks.
on:
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # The action itself checks that the commenter has write access. The association check only keeps
    # other commenters from starting a run that would fail there.
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/claude-review') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)

    runs-on: ubuntu-latest
    concurrency:
      group: claude-review-${{ github.event.issue.number }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      # The base branch goes to the workspace root, so CLAUDE.md and .claude/ come from it.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The pull request ref exists in this repository for pull requests from forks too.
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          path: pr-head
          fetch-depth: 1
          persist-credentials: false

      # Claude Code picks up CLAUDE.md files and skills from the folders it reads files in, and the
      # ones in this checkout come from the pull request author.
      - name: Remove Claude configuration from the pull request checkout
        run: find pr-head \( -name .claude -o -name CLAUDE.md -o -name CLAUDE.local.md \) -prune -exec rm -rf {} +

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # The plugin stops when Claude has already commented on the pull request, which would turn
          # every repeated request into a no-op, so the prompt lifts that check.
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.issue.number }}

            A maintainer asked for this review, so in step 1 stop only when the pull request is closed. Do not stop because it is a draft, looks like it needs no review, or already has comments from Claude: it may have changed since then. Do not post an inline comment for an issue that an earlier Claude comment on the same lines already reports.

            The working directory holds the base branch. The pull request head is checked out in pr-head, so read the changed files from there.
          # The gh commands are the ones the plugin uses to read the pull request and post its summary.
          # Its own allowed-tools list does not cover this run, so without them it is denied and posts nothing.
          claude_args: |
            --model claude-opus-5-5 --effort high
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
