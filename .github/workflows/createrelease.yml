---
name: "Build and Publish Release"

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Is this a pre-release?"
        required: true
        default: false
        type: boolean

jobs:
  release:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.semver.outputs.version }}

    steps:
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.2.10"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - uses: paulhatch/semantic-version@v5.4.0
        id: semver
        with:
          tag_prefix: ""
          major_pattern: "/!:|BREAKING CHANGE:/"
          minor_pattern: "/feat(\\(.+\\))?:/"
          version_format: "${major}.${minor}.${patch}"

      # if ${{ steps.semver.outputs.increment }} is 0, just fail because this release already exists
      - name: Check if release already exists
        if: ${{ steps.semver.outputs.increment == '0' }}
        run: exit 1

      # A stable release takes over the UNRELEASED changelog entries, which the changelog job commits once the release
      # exists. Checking them before the build fails a changelog with nothing to release in seconds.
      - name: Check Changelog
        if: ${{ !inputs.prerelease }}
        shell: pwsh
        run: |
          python scripts/release_changelog.py --check ${{ steps.semver.outputs.version }}

      - name: Build Release
        if: ${{ inputs.prerelease }}
        shell: pwsh
        run: |
          ./buildRelease.ps1 -Version ${{ steps.semver.outputs.version }} -Prerelease ${{ steps.semver.outputs.increment }}

      - name: Build Release
        if: ${{ !inputs.prerelease }}
        shell: pwsh
        run: |
          ./buildRelease.ps1 -Version ${{ steps.semver.outputs.version }} -Prerelease 0

      - name: Rename dist zip (pre-release)
        if: ${{ inputs.prerelease }}
        shell: pwsh
        run: |
          Move-Item -Force "./dist/PGPatcher.zip" "./dist/PGPatcher-${{ steps.semver.outputs.version }}-pre${{ steps.semver.outputs.increment }}.zip"
          Move-Item -Force "./dist/PGLite.zip" "./dist/PGLite-${{ steps.semver.outputs.version }}-pre${{ steps.semver.outputs.increment }}.zip"

      - name: Rename dist zip (stable release)
        if: ${{ !inputs.prerelease }}
        shell: pwsh
        run: |
          Move-Item -Force "./dist/PGPatcher.zip" "./dist/PGPatcher-${{ steps.semver.outputs.version }}.zip"
          Move-Item -Force "./dist/PGLite.zip" "./dist/PGLite-${{ steps.semver.outputs.version }}.zip"

      - name: Release Pre-Release
        uses: softprops/action-gh-release@v2
        if: ${{ inputs.prerelease }}
        with:
          name: ${{ steps.semver.outputs.version }}-pre${{ steps.semver.outputs.increment }}
          tag_name: ${{ steps.semver.outputs.version }}-pre${{ steps.semver.outputs.increment }}
          draft: true
          files: |
            ./dist/PGPatcher-${{ steps.semver.outputs.version }}-pre${{ steps.semver.outputs.increment }}.zip
            ./dist/PGLite-${{ steps.semver.outputs.version }}-pre${{ steps.semver.outputs.increment }}.zip
          generate_release_notes: true
          prerelease: true

      - name: Release Stable Release
        uses: softprops/action-gh-release@v2
        if: ${{ !inputs.prerelease }}
        with:
          name: ${{ steps.semver.outputs.version }}
          tag_name: ${{ steps.semver.outputs.version }}
          draft: true
          files: |
            ./dist/PGPatcher-${{ steps.semver.outputs.version }}.zip
            ./dist/PGLite-${{ steps.semver.outputs.version }}.zip
          generate_release_notes: true
          prerelease: false

  # Commits the dated changelog to main as the release app: a GitHub App with read and write access to contents and
  # pull requests, which main's branch protection lets bypass its pull request rule. Its ID and key live in the release
  # environment, which only main may use, so no workflow on another branch can act as the app. A job of its own, so
  # that it can be re-run without building the release again.
  changelog:
    needs: release
    if: ${{ !inputs.prerelease }}
    runs-on: ubuntu-latest
    environment:
      name: release
      deployment: false
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Update Changelog
        run: |
          python scripts/release_changelog.py ${{ needs.release.outputs.version }}

      - name: Get Release App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # GitHub takes the commit only while main's CHANGELOG.md is still the blob passed as sha, the one this release was
      # built from. Otherwise entries merged since would end up in the dated section, so the change goes through a pull
      # request instead.
      - name: Commit Changelog To Main
        id: commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          base64 -w0 CHANGELOG.md > "$RUNNER_TEMP/changelog.b64"
          if gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md" \
              -f message="docs: changelog for $VERSION" \
              -f sha="$(git rev-parse HEAD:CHANGELOG.md)" \
              -f branch=main \
              -F content=@"$RUNNER_TEMP/changelog.b64" \
              --jq .commit.html_url; then
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The dated changelog was not committed to main (see the error above), so it goes to a pull request. GitHub refuses the commit when CHANGELOG.md changed on main since the release was built, or when the release app may not bypass main's pull request rule."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open Changelog Pull Request
        if: ${{ steps.commit.outputs.committed != 'true' }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/changelog-${{ needs.release.outputs.version }}
          add-paths: CHANGELOG.md
          commit-message: "docs: changelog for ${{ needs.release.outputs.version }}"
          title: "docs: changelog for ${{ needs.release.outputs.version }}"
          labels: pr/docs
          body: |
            The ${{ needs.release.outputs.version }} release run moved the entries under `## UNRELEASED`
            into a dated `## [${{ needs.release.outputs.version }}]` section and opened an empty
            `## UNRELEASED` section above it for the next version. It could not commit this to main
            directly; the warning on the run says why.

            Merge this before publishing the draft release, so that its tag includes the dated
            section. Entries merged to main after the release was built belong under
            `## UNRELEASED`, but git merges those appended to the end of the old section into the
            dated section without a conflict, so check where they land.

            Generated by `scripts/release_changelog.py`, run by
            `.github/workflows/createrelease.yml`.
