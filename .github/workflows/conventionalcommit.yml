name: Conventional Commit Validation

# pull_request_target, not pull_request, so that labelling also works on pull
# requests from forks, where GITHUB_TOKEN is read only. Nothing here checks out
# or runs the pull request's code - it only reads the title from the event
# payload - so the usual pull_request_target risk does not apply.
on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: write

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commit Validation
        uses: ytanikin/pr-conventional-commits@1.4.0
        with:
          task_types: '["build", "ci", "docs", "feat", "fix", "perf", "refactor", "style", "test"]'
          custom_labels: '{"build": "pr/build", "ci": "pr/ci", "docs": "pr/docs", "feat": "pr/feat", "fix": "pr/fix", "perf": "pr/perf", "refactor": "pr/refactor", "style": "pr/style", "test": "pr/test"}'
