name: Build PGPatcher

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.2.10"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Build Artifact
        run: |
          ./buildRelease.ps1 -NoZip

      - name: Set up Python
        uses: actions/setup-python@v6

      - name: Cache clang-tidy
        id: clang-tidy-cache
        uses: actions/cache@v4
        with:
          path: clang-tidy
          key: clang-tidy-${{ hashFiles('scripts/clang-tidy-version.txt') }}

      - name: Install clang-tidy
        if: steps.clang-tidy-cache.outputs.cache-hit != 'true'
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $version = (Get-Content scripts/clang-tidy-version.txt -Raw).Trim()
          $package = "clang+llvm-$version-x86_64-pc-windows-msvc"
          Invoke-WebRequest "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/$package.tar.xz" -OutFile llvm.tar.xz
          New-Item -ItemType Directory clang-tidy | Out-Null
          # Only clang-tidy and its builtin headers; the rest of the package is not needed.
          tar -xf llvm.tar.xz -C clang-tidy --strip-components=1 "$package/bin/clang-tidy.exe" "$package/lib/clang"
          Remove-Item llvm.tar.xz

      - name: Run clang-tidy
        run: |
          $env:PATH = "$PWD\clang-tidy\bin;$env:PATH"
          python scripts/run_clang_tidy.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgpatcher-${{ github.sha }}
          path: dist/PGPatcher
