name: Translation Badges

on:
  pull_request:
    branches:
      - main
    paths:
      - "PGPatcher/translations/**"
      - "scripts/translation_badges.py"
      - ".github/workflows/translations.yml"
  push:
    branches:
      - main
    paths:
      - "PGPatcher/translations/**"
      - "scripts/translation_badges.py"
      - ".github/workflows/translations.yml"

permissions:
  contents: write

concurrency:
  group: translation-badges-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Branches in this repository get the regenerated badges committed straight
  # onto the pull request, so nothing lands on main.
  badges:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Pull Request Branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate Badges
        run: |
          python scripts/translation_badges.py --write --summary >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_ENV"
          else
            echo "changed=true" >> "$GITHUB_ENV"
          fi

      - name: Commit Badges To Pull Request
        if: env.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: update translation coverage badges"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"

      - name: Report Fork Pull Request
        if: env.changed == 'true' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          {
            echo ""
            echo "> Badges cannot be committed to a fork branch, because \`GITHUB_TOKEN\`"
            echo "> has no write access there. They will be committed to main once"
            echo "> this one is merged."
          } >> "$GITHUB_STEP_SUMMARY"
          git --no-pager diff

  # Fork pull requests cannot be written to, so catch the drift after the merge
  # and commit it to main as the release app, which is on the bypass list of
  # main's ruleset (see the changelog job in createrelease.yml). Its ID and key
  # live in the release environment, which only main may use.
  sync:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: release
      deployment: false
    permissions:
      contents: read

    steps:
      - name: Get Release App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # The latest main rather than the pushed commit, so a re-run regenerates
      # from what main holds now. The checkout keeps the app's token for the push.
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate Badges
        run: |
          python scripts/translation_badges.py --write --summary >> "$GITHUB_STEP_SUMMARY"

      - name: Commit Badges To Main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          git add -A .github/badges/translations README.md
          if git diff --cached --quiet; then
            echo "The badges already match the translations."
            exit 0
          fi
          id=$(gh api "users/$BOT" --jq .id)
          git -c user.name="$BOT" -c user.email="$id+$BOT@users.noreply.github.com" \
            commit -m "docs: refresh translation coverage badges"
          git push origin HEAD:main
