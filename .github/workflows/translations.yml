name: Translation Badges

on:
  pull_request:
    branches:
      - main
    paths:
      - "PGPatcher/translations/**"
      - "scripts/translation_badges.py"
      - ".github/workflows/translations.yml"
  push:
    branches:
      - main
    paths:
      - "PGPatcher/translations/**"
      - "scripts/translation_badges.py"
      - ".github/workflows/translations.yml"

permissions:
  contents: write

concurrency:
  group: translation-badges-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Branches in this repository get the regenerated badges committed straight
  # onto the pull request, so nothing lands on main.
  badges:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Pull Request Branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate Badges
        run: |
          python scripts/translation_badges.py --write --summary >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_ENV"
          else
            echo "changed=true" >> "$GITHUB_ENV"
          fi

      - name: Commit Badges To Pull Request
        if: env.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: update translation coverage badges"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"

      - name: Report Fork Pull Request
        if: env.changed == 'true' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          {
            echo ""
            echo "> Badges cannot be committed to a fork branch, because \`GITHUB_TOKEN\`"
            echo "> has no write access there. They will be refreshed by a follow-up"
            echo "> pull request once this one is merged."
          } >> "$GITHUB_STEP_SUMMARY"
          git --no-pager diff

  # Fork pull requests cannot be written to, so catch the drift after the merge
  # and raise it as its own pull request rather than pushing to main.
  sync:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate Badges
        run: |
          python scripts/translation_badges.py --write --summary >> "$GITHUB_STEP_SUMMARY"

      - name: Open Badge Refresh Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/translation-badges
          delete-branch: true
          add-paths: |
            .github/badges/translations
            README.md
          commit-message: "docs: refresh translation coverage badges"
          title: "docs: refresh translation coverage badges"
          labels: pr/docs
          body: |
            The translation coverage badges on `main` no longer match
            `PGPatcher/translations`, so this pull request regenerates them.

            This normally happens after merging a translation from a fork: the
            workflow cannot commit to a fork's branch, so the refresh arrives
            here instead.

            Generated by `scripts/translation_badges.py --write`, run by
            [translations.yml](.github/workflows/translations.yml). Nothing here
            is hand written - the same command reproduces it locally.
